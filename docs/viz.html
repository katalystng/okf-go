<!DOCTYPE html>
<!-- Adapted from the OKF bundle viewer in GoogleCloudPlatform/knowledge-catalog (Apache-2.0). See NOTICE. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF bundle viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
/* Adapted from the OKF bundle viewer in GoogleCloudPlatform/knowledge-catalog (Apache-2.0). See NOTICE. */
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

/* Layer legend and attribution, added in this port. */
.legend { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.legend-swatch { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0f172a; }
.attribution-list { margin: 0; padding-left: 18px; }

</style>
</head>

<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="legend" id="legend"></div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
        <dt id="detail-attribution-label" hidden>Attribution</dt><dd id="detail-attribution" hidden></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

window.BUNDLE = {"nodes":[{"data":{"attribution":{"authors":["claude"],"contributors":["human:travissutton"],"derivation":"paraphrased","model":"claude-opus-5-5"},"color":"#3b82f6","description":"The purpose of okf-go: shared tooling that checks and renders the OKF bundles repositories keep as their docs.","generated":null,"id":"intent/okf-go","label":"okf-go","layer":"intent","resource":"","size":35,"sources":[],"stale_after":"","status":"stable","tags":["okf","purpose"],"trust_tier":"unverified","type":"Intent","verified":[]}},{"data":{"attribution":{"authors":["claude"],"derivation":"original","model":"claude-opus-5-5"},"color":"#f59e0b","description":"How to install okf, run its commands, and wire them into a repository.","generated":null,"id":"product/usage","label":"Usage","layer":"product","resource":"","size":35,"sources":[{"resource":"/spec/check.md"},{"resource":"/spec/viz.md"}],"stale_after":"","status":"stable","tags":["usage"],"trust_tier":"unverified","type":"Product Documentation","verified":[]}},{"data":{"attribution":{"authors":["claude"],"derivation":"original","model":"claude-opus-5-5"},"color":"#10b981","description":"The requirements for okf check: what a bundle is checked for and how a finding fails a run.","generated":null,"id":"spec/check","label":"check","layer":"spec","resource":"","size":34,"sources":[{"resource":"/intent/okf-go.md"}],"stale_after":"","status":"stable","tags":["check"],"trust_tier":"unverified","type":"Specification","verified":[]}},{"data":{"attribution":{"authors":["claude"],"derivation":"original","model":"claude-opus-5-5"},"color":"#10b981","description":"The requirements for okf viz: the page a bundle renders as, and how a committed page stays current.","generated":null,"id":"spec/viz","label":"viz","layer":"spec","resource":"","size":34,"sources":[{"resource":"/intent/okf-go.md"}],"stale_after":"","status":"stable","tags":["viz"],"trust_tier":"unverified","type":"Specification","verified":[]}}],"edges":[{"data":{"id":"product/usage__spec/check","kind":"link","source":"product/usage","target":"spec/check"}},{"data":{"id":"product/usage__spec/viz","kind":"link","source":"product/usage","target":"spec/viz"}},{"data":{"id":"spec/check__intent/okf-go","kind":"link","source":"spec/check","target":"intent/okf-go"}},{"data":{"id":"spec/viz__intent/okf-go","kind":"link","source":"spec/viz","target":"intent/okf-go"}}],"bodies":{"intent/okf-go":"\n# okf-go\n\n## Purpose\n\nRepositories keep their docs in the repository as an Open Knowledge Format (OKF) v0.2 bundle. okf-go is the one shared tool those repositories pin, so each one checks and renders its bundle the same way.\n\n## What it does\n\n- check: a bundle is checked for conformance with OKF v0.2 and for the guidance the specification gives, so a broken link or an index that drifts from its files is caught before it merges.\n- viz: a bundle renders as one HTML page with a graph of its concepts, a quick way for a reader to view and navigate the docs.\n\n## Defaults and enrichment\n\n- The tool implements plain OKF v0.2 as its default.\n- Layers color the graph by default, from each concept's top-level folder.\n- Attribution shows when a concept's frontmatter holds it.\n\n## Distribution\n\n- The repository is public, under the Apache License 2.0.\n- The project carries little organization branding.\n- A consuming repository pins a tagged release in its `go.mod`.\n\n## Its own docs\n\nokf-go keeps its docs as an OKF bundle in `docs/`, and its CI checks that bundle with the tool itself.\n","product/usage":"\n# Usage\n\nThe commands implement [check](../spec/check.md) and [viz](../spec/viz.md).\n\n## Install as a Go tool\n\nA Go module pins okf with the `tool` directive, so the version sits in `go.mod` and Dependabot proposes bumps:\n\n```sh\ngo get -tool github.com/katalystng/okf-go/cmd/okf@latest\ngo tool okf check docs\n```\n\n## check\n\n```sh\nokf check [-strict] \u003cbundle\u003e\n```\n\n## viz\n\n```sh\nokf viz [-o file] [-name name] [-layers a,b,c] [-check] \u003cbundle\u003e\n```\n\nThe page defaults to `\u003cbundle\u003e/viz.html`. The name defaults to the bundle folder's name, or to its parent's name when the folder is `docs`.\n\n## Wire into a repository\n\nA Makefile target regenerates the page, and the verify target checks both the bundle and the page:\n\n```make\ndocs-viz:\n\tgo tool okf viz -layers intent,spec,decisions,product docs\n\nverify-docs:\n\tgo tool okf check docs\n\tgo tool okf viz -check -layers intent,spec,decisions,product docs\n```\n\n## The viewer\n\nThe page is a port of the bundle viewer in GoogleCloudPlatform/knowledge-catalog. It loads Cytoscape 3.28.1 and marked 12.0.0 from jsdelivr, so a reader needs network access to view it.\n","spec/check":"\n# check\n\nRests on [the intent](../intent/okf-go.md).\n\n## Governed paths\n\n```yaml\npaths:\n  - bundle/**\n  - check/**\n  - cmd/okf/**\n```\n\n## Requirements\n\n- Conformance: a failure of OKF v0.2 section 11 is an error. A concept document lacks frontmatter, its frontmatter fails to parse, or it lacks `type`.\n- Guidance: a departure from guidance the specification gives as SHOULD is a warning. Examples are a relative or bundle-relative link that resolves to no file, an index that leaves out a file or folder beside it, and an index entry that differs from the concept's `description`.\n- Optional fields: a trust, lifecycle, or provenance field is checked when it is present, against OKF v0.2 section 5.\n- Extensions: a field the bundle adds of its own is checked when it is present. `attribution` is one.\n- Exit: a run exits 1 on an error. With `-strict` it also exits 1 on a warning.\n- Output: each finding prints as `path:line: severity: message`, sorted by path and line.\n","spec/viz":"\n# viz\n\nRests on [the intent](../intent/okf-go.md).\n\n## Governed paths\n\n```yaml\npaths:\n  - viz/**\n  - cmd/okf/**\n```\n\n## Requirements\n\n- Page: a bundle renders as one HTML file that holds its data and its code, with each concept a node and a detail pane for the selected one.\n- Edges: a relative link and a bundle-relative link to a concept each draw an edge. A `sources` entry that names a concept draws a dashed edge.\n- Layers: each concept takes the color of its top-level folder. `-layers` orders the folders, and the legend dims every other layer on a click.\n- Attribution: a concept whose frontmatter holds `attribution` shows it in the detail pane.\n- Stability: the page depends on the bundle alone. Staleness, which depends on the time of viewing, is computed in the page.\n- Currency: `okf viz -check` writes nothing and exits 1 when the page on disk differs from a fresh render, so a repository can commit its page and check it.\n"},"types":["Intent","Product Documentation","Specification"],"layers":[{"name":"intent","color":"#3b82f6"},{"name":"spec","color":"#10b981"},{"name":"product","color":"#f59e0b"}]};

<script>
// Adapted from the OKF bundle viewer in GoogleCloudPlatform/knowledge-catalog (Apache-2.0). See NOTICE.
// Changes: staleness is computed when the page is viewed, so a committed page stays the same across
// days; relative and bundle-relative links both open their concept; a source that names a concept
// draws a dashed edge; nodes take their layer's color, with a legend; attribution shows when present.
(function () {
  const bundle = window.BUNDLE;
  const now = Date.now();
  for (const n of bundle.nodes) {
    const sa = n.data.stale_after ? Date.parse(n.data.stale_after) : NaN;
    n.data.stale = !Number.isNaN(sa) && /T/.test(n.data.stale_after) && now >= sa;
  }
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Layer legend: a click dims every other layer, and a second click clears it.
  const legend = document.getElementById("legend");
  let activeLayer = "";
  for (const layer of bundle.layers || []) {
    const item = document.createElement("span");
    item.className = "legend-item";
    const swatch = document.createElement("span");
    swatch.className = "legend-swatch";
    swatch.style.background = layer.color;
    item.appendChild(swatch);
    item.appendChild(document.createTextNode(layer.name));
    item.addEventListener("click", () => {
      activeLayer = activeLayer === layer.name ? "" : layer.name;
      dimBy((n) => activeLayer && n.data("layer") !== activeLayer);
    });
    legend.appendChild(item);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    if (!(backlinks[target] ||= []).includes(source)) backlinks[target].push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node[?stale]",
        style: {
          "border-width": 2,
          "border-color": "#b91c1c",
          "border-style": "dashed",
        },
      },
      {
        selector: 'node[status = "deprecated"]',
        style: {
          "opacity": 0.55,
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: 'edge[kind = "source"]',
        style: {
          "line-style": "dashed",
          "line-color": "#94a3b8",
          "target-arrow-color": "#94a3b8",
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    dimBy((n) => t && n.data("type") !== t);
  });

  function dimBy(hide) {
    cy.nodes().forEach((n) => n.toggleClass("dim", Boolean(hide(n))));
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  }

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // v0.2 signal badges: status, trust tier, staleness.
    const badgesEl = document.getElementById("detail-badges");
    badgesEl.innerHTML = "";
    const status = data.status || "stable";
    badgesEl.appendChild(makeBadge(status, "status-" + status));
    const tier = data.trust_tier || "unverified";
    badgesEl.appendChild(makeBadge(tier.replace(/-/g, " "), "trust-" + tier));
    if (data.stale) {
      const label = data.stale_after ? `stale (since ${data.stale_after})` : "stale";
      badgesEl.appendChild(makeBadge(label, "stale"));
    } else if (data.stale_after) {
      badgesEl.appendChild(makeBadge(`stale after ${data.stale_after}`, "fresh"));
    }

    document.getElementById("detail-generated").textContent = formatActorEvent(data.generated);

    const verifiedEl = document.getElementById("detail-verified");
    const verified = data.verified || [];
    if (verified.length) {
      verifiedEl.textContent = verified.map(formatActorEvent).join("; ");
    } else {
      verifiedEl.textContent = "—";
    }

    const sourcesEl = document.getElementById("detail-sources");
    sourcesEl.innerHTML = "";
    const sources = data.sources || [];
    if (sources.length) {
      const ul = document.createElement("ul");
      ul.className = "sources-list";
      for (const s of sources) {
        const li = document.createElement("li");
        const label = s.title || s.resource || s.id || "source";
        if (s.resource && /^https?:\/\//.test(s.resource)) {
          const a = document.createElement("a");
          a.href = s.resource;
          a.textContent = label;
          a.target = "_blank";
          a.rel = "noopener";
          a.className = "external";
          li.appendChild(a);
        } else {
          li.textContent = s.resource ? `${label} (${s.resource})` : label;
        }
        ul.appendChild(li);
      }
      sourcesEl.appendChild(ul);
    } else {
      sourcesEl.textContent = "—";
    }

    const attrLabel = document.getElementById("detail-attribution-label");
    const attrEl = document.getElementById("detail-attribution");
    attrEl.innerHTML = "";
    const attr = data.attribution;
    attrLabel.hidden = attrEl.hidden = !attr;
    if (attr) {
      const ul = document.createElement("ul");
      ul.className = "attribution-list";
      for (const key of ["derivation", "model", "authors", "contributors"]) {
        if (attr[key] === undefined) continue;
        const li = document.createElement("li");
        const value = Array.isArray(attr[key]) ? attr[key].join(", ") : String(attr[key]);
        li.textContent = `${key}: ${value}`;
        ul.appendChild(li);
      }
      attrEl.appendChild(ul);
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl, conceptId);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function makeBadge(text, cls) {
    const span = document.createElement("span");
    span.className = "badge " + cls;
    span.textContent = text;
    return span;
  }

  function formatActorEvent(event) {
    if (!event || !event.by) return "—";
    return event.at ? `${event.by} · ${event.at}` : String(event.by);
  }

  // resolve turns a link in the concept fromId into a concept id, for bundle-relative and relative
  // links alike.
  function resolve(fromId, href) {
    const path = href.split("#")[0];
    if (!path.endsWith(".md")) return null;
    const parts = path.startsWith("/") ? [] : fromId.split("/").slice(0, -1);
    for (const seg of path.replace(/^\//, "").split("/")) {
      if (seg === "" || seg === ".") continue;
      if (seg === "..") parts.pop();
      else parts.push(seg);
    }
    return parts.join("/").slice(0, -3);
  }

  function rewriteInternalLinks(root, fromId) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (!/^[a-z][a-z0-9+.-]*:/i.test(href) && !href.startsWith("#")) {
        const target = resolve(fromId, href);
        if (target && nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first concept.
  const initial = bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
