# A pull request merges as one squash commit titled with the pull request's title, and
# release-please reads that commit. This check holds each title to the Conventional Commits
# types that release-please-config.json sorts into the changelog.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            deps
            perf
            revert
            chore
            docs
            style
            refactor
            test
            build
            ci
